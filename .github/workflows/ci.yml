name: CI

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  harness:
    name: Sort harness (clang + Python, native Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (LLVM)
        run: winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements

      - name: Add clang to PATH
        run: echo "%ProgramFiles%\LLVM\bin">>"%GITHUB_PATH%"

      - name: Regression suite (default)
        run: python build_sort_test.py

      - name: Regression suite + perf comparison
        run: python build_sort_test.py --perf

  gui-version-fit:
    name: GUI version fit (real offscreen render)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 toolchain and DejaVu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtbase5-dev-tools qt5-qmake g++ pkg-config fonts-dejavu-core

      - name: Static check (declared frames vs measured text)
        run: python3 dist/tests/test_gui_version_layout.py

      - name: Render the real Qt window offscreen
        run: bash dist/tests/test_gui_render.sh

  readme-release:
    name: README vs published release (SHA-256, assets, links)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Confronte les sommes SHA-256, la liste des assets et les liens inscrits
      # dans README.md / README.fr.md a la vraie release GitHub. Sans telecharger
      # les paquets : les sommes sont lues dans les SHA256SUMS* publies.
      # Le token leve le quota de l'API (60 requetes/h en anonyme, partagees
      # entre les runners).
      - name: Check the release declared in the README
        env:
          GH_TOKEN: ${{ github.token }}
        # Au moment de la publication, les README annoncent encore la release
        # précédente au sens de /releases/latest : les paquets binaires ne sont
        # attachés qu'après coup. Seule cette égalité est tolérée alors ; tous
        # les autres contrôles restent stricts, et le push suivant relit tout.
        run: python3 dist/check_readme_release.py ${{ github.event_name == 'release' && '--allow-newer-release' || '' }}

  move-tag-bench:
    name: MOVE_TAG bench (offline, mocked git/gh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Fully offline: throwaway git sandbox with a local bare origin, gh
      # shadowed by a Python mock. Needs cmd.exe + csc.exe (shim build),
      # both present on the hosted Windows runners.
      - name: MOVE_TAG + rollback bench (146 assertions)
        shell: bash
        run: bash dist/tests/test_make_release_move_tag.sh

      - name: WSL build supervisor (simulated VM interruption)
        shell: bash
        run: bash dist/tests/test_wsl_build_supervisor.sh

  preflight-release:
    name: Preflight (tag/release state) before e2e
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/preflight-move-tag.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  release-e2e:
    name: E2E check of the published release
    if: github.event_name == 'release'
    needs: preflight-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (LLVM)
        run: winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements

      - name: Add clang to PATH
        run: echo "%ProgramFiles%\LLVM\bin">>"%GITHUB_PATH%"

      - name: End-to-end release check (download, SHA256SUMS, extract, sweep, harness)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: dist\check_release.cmd
