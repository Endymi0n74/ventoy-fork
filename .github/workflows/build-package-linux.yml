name: Release package (Linux)

# Builds the binary Linux package of a published release from scratch on a
# plain ubuntu runner (no WSL, no MSBuild), validates it with the 3 package
# checks of dist/check_release_pkg.py, and attaches it to the release when it
# is not there yet.
#
# Deliberately separate from build-package.yml (the Windows package) and from
# ci.yml, so that:
#   - it never runs on a plain push (GRUB is rebuilt for four targets);
#   - the workflow-level token stays `contents: read`; only this job asks for
#     `contents: write`, and only to upload assets.
#
# Runner is pinned to ubuntu-24.04 rather than ubuntu-latest: the compiler
# version changes the bytes GRUB produces, so a drifting label would silently
# change the published fingerprint from one release to the next.
#
# GUI_REBUILD is deliberately left off. It would rebuild only the x86_64 Qt GUI
# and is refused anyway unless the result stays below the official runtime's
# GLIBC/Qt requirements; this runner is far too new for that. The package
# therefore ships the official GUI binaries, like every build so far.

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish the package for
        required: true
        type: string
      clobber:
        description: Replace an already published ventoy-*-linux.tar.gz asset
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-package:
    name: Linux binary package and upload
    # Prereleases are skipped: check_release_pkg.py pins ventoy/version to
    # \d+\.\d+\.\d+-ventoy-sort, which an "-rc1" suffix fails by design.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    concurrency:
      group: release-package-linux-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      CLOBBER: ${{ github.event_name == 'workflow_dispatch' && inputs.clobber || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and check the release tag
        id: meta
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no release tag to build (release event or tag input)"
            exit 1
          fi
          tag=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          if [ $? -ne 0 ]; then echo "::error::no release named $TAG"; exit 1; fi
          echo "tag: $tag"
          ver=${TAG#v}
          echo "VER=$ver" >> "$GITHUB_OUTPUT"
          echo "PKG=ventoy-$ver-linux.tar.gz" >> "$GITHUB_OUTPUT"
          echo "SUMS=SHA256SUMS-ventoy-sort-linux.txt" >> "$GITHUB_OUTPUT"

      - name: Refuse to sign without the documented MOK key
        env:
          VENTOY_SORT_MOK_KEY: ${{ secrets.ventoy_sort_mok_key }}
          VENTOY_SORT_MOK_CRT: ${{ secrets.ventoy_sort_mok_crt }}
        run: |
          if [ -z "$VENTOY_SORT_MOK_KEY" ] || [ -z "$VENTOY_SORT_MOK_CRT" ]; then
            echo "::error::secrets ventoy_sort_mok_key / ventoy_sort_mok_crt are not set. Without them the build would mint a throwaway Secure Boot key, and the package would then be signed with a certificate that PROCEDURE-SECURE-BOOT.md does not describe."
            exit 1
          fi
          echo "MOK key material supplied (value not printed)."

      - name: Install the build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake autopoint gettext pkg-config \
            bison flex python3 mtools xz-utils zip unzip tar gzip git curl \
            ca-certificates openssl gcc-aarch64-linux-gnu sbsigntool

      - name: Fetch and pin the official 1.1.17 baseline
        run: |
          set -euo pipefail
          # The build reads this file as BASE_LINUX and check_release_pkg.py
          # looks for its own baseline in <repo>/_dl, so one download serves both.
          mkdir -p _dl
          curl -fL --retry 3 -o _dl/ventoy-1.1.17-linux.tar.gz \
            https://github.com/ventoy/Ventoy/releases/download/v1.1.17/ventoy-1.1.17-linux.tar.gz
          echo "7fb4ed08cef6a6b4d39dd19260d8c80291a78dfdf9af7d461571e23cbbc43805  _dl/ventoy-1.1.17-linux.tar.gz" | sha256sum -c -

      - name: Build the Linux package
        env:
          VENTOY_SORT_MOK_KEY: ${{ secrets.ventoy_sort_mok_key }}
          VENTOY_SORT_MOK_CRT: ${{ secrets.ventoy_sort_mok_crt }}
        run: |
          set -euo pipefail
          test -f dist/ventoy-sort-build/build_ventoy_sort_linux.sh \
            || { echo "::error::run from the repository root"; exit 1; }
          cd dist/ventoy-sort-build
          ./build_ventoy_sort_linux.sh \
            "FORK_VERSION=${{ env.TAG }}" \
            "BASE_LINUX=$PWD/../../_dl/ventoy-1.1.17-linux.tar.gz"

      - name: Package checks (fingerprint / marker / baseline)
        run: |
          set -euo pipefail
          cd dist/ventoy-sort-build
          ver="${TAG#v}"
          pkg="ventoy-$ver-linux.tar.gz"
          test -f "$pkg" || { echo "::error::expected $pkg"; exit 1; }
          PYTHONIOENCODING=utf-8 python3 ../check_release_pkg.py "$pkg"

      - name: Package is signed with the supplied MOK key
        env:
          VENTOY_SORT_MOK_CRT: ${{ secrets.ventoy_sort_mok_crt }}
        run: |
          set -euo pipefail
          # The failure this guards against is silent: without the key the build
          # would mint its own, every other check would still pass, and the
          # published package would carry a certificate no procedure mentions.
          cd dist/ventoy-sort-build
          ver="${TAG#v}"
          pkg="ventoy-$ver-linux.tar.gz"
          python3 - "$pkg" /tmp/disk.xz <<'PY'
          import sys, tarfile
          with tarfile.open(sys.argv[1]) as t:
              names = [n for n in t.getnames() if n.endswith('ventoy/ventoy.disk.img.xz')]
              if len(names) != 1:
                  sys.exit('expected exactly one ventoy/ventoy.disk.img.xz, got %d' % len(names))
              member = t.getmember(names[0])
              src = t.extractfile(member)
              with open(sys.argv[2], 'wb') as out:
                  while True:
                      chunk = src.read(1 << 20)
                      if not chunk:
                          break
                      out.write(chunk)
          PY
          xz -dc /tmp/disk.xz > /tmp/disk.img
          mtype -i /tmp/disk.img ::/ENROLL_THIS_KEY_IN_MOKMANAGER.cer > /tmp/embedded.cer
          expected=$(printf '%s' "$VENTOY_SORT_MOK_CRT" | tr -d '\r' \
                     | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)
          actual=$(sha256sum /tmp/embedded.cer | cut -d' ' -f1)
          echo "embedded : $actual"
          echo "supplied : $expected"
          [ "$actual" = "$expected" ] \
            || { echo "::error::the package embeds a certificate other than the supplied MOK key"; exit 1; }
          echo "the package carries the supplied MOK certificate"

      - name: Attach the package to the release when it is missing
        run: |
          set -euo pipefail
          pkg="dist/ventoy-sort-build/${{ steps.meta.outputs.PKG }}"
          sums="dist/ventoy-sort-build/${{ steps.meta.outputs.SUMS }}"

          present=0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq ".assets[].name" | grep -Fxq "${{ steps.meta.outputs.PKG }}"; then
            present=1
          fi

          # A package already published is kept as it is: its checksum is the one
          # the release notes record. Rebuilding is deterministic per toolchain,
          # but a different runner image would change the bytes, so replacing a
          # published asset has to be a deliberate act.
          if [ "$present" = 1 ] && [ "$CLOBBER" != true ]; then
            echo "::notice::asset ${{ steps.meta.outputs.PKG }} already published — keeping it (its checksum is the one recorded in the release notes); pass clobber=true to replace it deliberately."
            echo "published asset left untouched: ${{ steps.meta.outputs.PKG }}"
            exit 0
          fi

          if [ "$present" = 1 ]; then mode="Replacing"; else mode="Adding"; fi
          gh release upload "$TAG" "$pkg" "$sums" --repo "$GITHUB_REPOSITORY" --clobber
          echo "$mode asset ${{ steps.meta.outputs.PKG }} and ${{ steps.meta.outputs.SUMS }}"

      - name: Report
        run: |
          pkg="dist/ventoy-sort-build/${{ steps.meta.outputs.PKG }}"
          sums="dist/ventoy-sort-build/${{ steps.meta.outputs.SUMS }}"
          echo "built locally: ${{ steps.meta.outputs.PKG }}"
          echo "local sha256: $(sha256sum "$pkg" | cut -d' ' -f1)"
          echo "published assets:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name)  \(.size) o"'